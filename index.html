<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fatefall — An AI-Run Tabletop Adventure</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
      /* The game renders in a fixed 1024x768 space. Both the canvas and the
         UI overlay are centered on the window and scaled by the same factor,
         so on small windows the whole game letterboxes and the HUD shrinks
         proportionally instead of overflowing or colliding. */
      canvas {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
      }
      #ui-overlay {
        position: fixed; top: 50%; left: 50%;
        width: 1024px; height: 768px;
        transform-origin: center;
        pointer-events: none; z-index: 10;
      }
      #ui-overlay > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
