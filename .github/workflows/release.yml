# Builds the Windows installer and portable exe and attaches them to a GitHub
# release whenever a version tag is pushed. The app's launch update check reads
# the latest release, so publishing a tag is what makes an update appear to
# players.
#
#   npm version minor      # bumps package.json and tags vX.Y.0
#   git push --follow-tags
#
# The test suite runs on every push and pull request as well.
name: release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Fatefall Setup *.exe
            release/Fatefall *.exe
          generate_release_notes: true
